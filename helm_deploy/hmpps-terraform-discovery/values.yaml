---
image:
  repository: ecr_repository # override at deployment time
  tag: app_version # override at deployment time

generic-prometheus-alerts:
  targetApplication: hmpps-terraform-discovery

discoveryCronJob:
  namespace_secrets:
    hmpps-terraform-discovery:
      SERVICE_CATALOGUE_API_ENDPOINT: "SERVICE_CATALOGUE_API_ENDPOINT"
      SERVICE_CATALOGUE_API_KEY: "SERVICE_CATALOGUE_API_KEY"
    hmpps-sre-app-slack-bot:
      SLACK_BOT_TOKEN: "SLACK_BOT_TOKEN"
