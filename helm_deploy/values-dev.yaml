---
# Per environment values which override defaults in hmpps-terraform-discovery/values.yaml

discoveryCronJob:
  enabled: true
  env:
    LOG_LEVEL: debug
  namespace_secrets:
    hmpps-envoy-https-proxy-env:
      HTTP_PROXY: "HTTP_PROXY"
      HTTPS_PROXY: "HTTPS_PROXY"
      NO_PROXY: "NO_PROXY"
      http_proxy: "HTTP_PROXY"
      https_proxy: "HTTPS_PROXY"
      no_proxy: "NO_PROXY"

cron:
  github_terraform_discovery: "05 9 * * *"

generic-prometheus-alerts:
  alertSeverity: hmpps-sre-alerts-nonprod
